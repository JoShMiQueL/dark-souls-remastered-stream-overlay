<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Souls Tracker - Custom Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: white;
        }
        
        .stat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            border-left: 3px solid #ff6600;
        }
        
        .stat-label {
            font-weight: bold;
            min-width: 100px;
            color: #ff6600;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        
        .stat-value.highlight {
            color: #ff4444;
        }
        
        /* Example: HP bar styling */
        .hp-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff6600);
            transition: width 0.3s ease;
        }
        
        /* Example: Souls counter with emoji */
        .souls-counter {
            font-size: 28px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="stat-container">
        <!-- HP with bar -->
        <div class="stat-row">
            <span class="stat-label">HP</span>
            <div class="hp-bar">
                <div class="hp-fill" id="hp-bar" style="width: 0%"></div>
            </div>
            <span class="stat-value" id="hp-display">-</span>
        </div>
        
        <!-- Simple death counter -->
        <div class="stat-row">
            <span class="stat-label">Deaths</span>
            <span class="stat-value highlight" id="deaths-display">-</span>
        </div>
        
        <!-- Souls with emoji -->
        <div class="stat-row">
            <span class="stat-label">Souls</span>
            <span class="stat-value souls-counter" id="souls-display">-</span>
        </div>
        
        <!-- Soul Level -->
        <div class="stat-row">
            <span class="stat-label">SL</span>
            <span class="stat-value" id="sl-display">-</span>
        </div>
    </div>

    <script>
        // WebSocket configuration
        // Change this if you're using a different port (configured in dstracker.ini)
        const WS_PORT = 3000;
        const WS_HOST = 'localhost';
        
        // WebSocket connection
        const ws = new WebSocket(`ws://${WS_HOST}:${WS_PORT}/ws`);
        
        // Format play time as H:MM:SS
        function formatPlayTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        // Update stats when data arrives
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Update HP display and bar
            if (data.hp !== undefined && data.maxHp !== undefined) {
                document.getElementById('hp-display').textContent = `${data.hp}/${data.maxHp}`;
                const hpPercent = (data.hp / data.maxHp) * 100;
                document.getElementById('hp-bar').style.width = `${hpPercent}%`;
            }
            
            // Update deaths
            if (data.deaths !== undefined) {
                document.getElementById('deaths-display').textContent = data.deaths;
            }
            
            // Update souls
            if (data.souls !== undefined) {
                document.getElementById('souls-display').textContent = data.souls.toLocaleString();
            }
            
            // Update soul level
            if (data.soulLevel !== undefined) {
                document.getElementById('sl-display').textContent = data.soulLevel;
            }
        };
        
        // Auto-reconnect on disconnect
        ws.onclose = function() {
            console.log('WebSocket disconnected, reconnecting in 3 seconds...');
            setTimeout(function() {
                location.reload();
            }, 3000);
        };
        
        // Handle connection errors
        ws.onerror = function(error) {
            console.error('WebSocket error:', error);
        };
        
        // Connection established
        ws.onopen = function() {
            console.log('WebSocket connected');
        };
    </script>
</body>
</html>
