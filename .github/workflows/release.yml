name: Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build (Release x64)
        run: |
          msbuild DarkSoulsTracker.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:OutDir=build\Release\ `
            /p:IntDir=build\Release\obj\ `
            /v:minimal `
            /nologo

      - name: Generate SHA-256 checksum
        run: |
          $hash = (Get-FileHash -Path build\Release\dinput8.dll -Algorithm SHA256).Hash
          "$hash  dinput8.dll" | Out-File -FilePath build\Release\SHA256SUMS.txt -Encoding utf8
          Write-Host "SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Dark Souls Remastered Stream Overlay ${{ github.ref_name }}"
          body: |
            ## Installation
            1. Download `dinput8.dll` below
            2. Copy it to your Dark Souls Remastered folder:
               `C:\Program Files (x86)\Steam\steamapps\common\DARK SOULS REMASTERED\`
            3. Launch the game — the WebSocket server starts on port 3000
            4. (Optional) Create a `dstracker.ini` next to the DLL to change the port

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage instructions.

            ## Verify download
            ```
            certutil -hashfile dinput8.dll SHA256
            ```
            Compare the output with `SHA256SUMS.txt`.
          files: |
            build\Release\dinput8.dll
            build\Release\SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
